<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="stadiumGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="arenaTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Stadium Ring -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="2.5" />
  
  <!-- Architectural Stadium Oval Outer -->
  <ellipse cx="60" cy="60" rx="42" ry="26" fill="none" stroke="url(#arenaTrack)" stroke-width="2" stroke-dasharray="4 2" />
  
  <!-- Stadium Inner Bowl -->
  <ellipse cx="60" cy="60" rx="30" ry="18" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  
  <!-- Central Operations Hub Spire -->
  <polygon points="60,34 74,60 60,86 46,60" fill="url(#stadiumGlow)" filter="url(#glowFilter)" />
  <circle cx="60" cy="60" r="4" fill="#ffffff" />
  
  <!-- Operational Beam Rays -->
  <line x1="26" y1="60" x2="42" y2="60" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  <line x1="78" y1="60" x2="94" y2="60" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="26" x2="60" y2="42" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="78" x2="60" y2="94" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
</svg>
